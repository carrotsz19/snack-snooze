<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Clickable prototype of Snack & Snooze, a nap-pod booking service. FOB2 CA1, Group 4.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Snack &amp; Snooze Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Veyra Study phone shell. Stage (header, view, acrylic dock) recedes under an Apple Pay-style sheet.
   Tokens: Veyra UI standard v1 surfaces + Ocean accent (matches the deck's blue). Motion: JS damped springs (Apple archetypes). */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#eceae5; --fill-3:rgba(27,26,24,.05); --line:#dcd8cf;
  --ink:#1b1a18; --dim:#6d6961; --faint:rgba(27,26,24,.38);
  --accent:#2f5f8a; --accent-soft:#dde7f0; --on-tint:#ffffff; --glow:rgba(47,95,138,.28);
  --ok:#3f6b4a; --ok-soft:#e0ece2; --amber:#a86f1d; --amber-soft:#f3e6cf;
  --toast:#1b1a18; --toast-ink:#f3f1ec;
  --glass-tint:rgba(255,255,255,.62); --glass-edge:rgba(27,26,24,.08); --glass-hi:rgba(255,255,255,.7);
  --elev-1:0 1px 2px rgba(27,26,24,.04),0 4px 12px rgba(27,26,24,.05);
  --elev-3:0 0 0 1px rgba(27,26,24,.04),0 8px 16px rgba(27,26,24,.07),0 24px 64px rgba(27,26,24,.16);
  --r-control:10px; --r-card:14px; --r-sheet:28px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --spring:linear(0,0.035,0.12,0.228,0.345,0.458,0.563,0.655,0.734,0.799,0.851,0.893,0.926,0.95,0.969,0.982,0.991,0.997,1.001,1.003,1.005,1.005,1.005,1.005,1.004,1.003,1.003,1.002,1);
  --spring-bouncy:linear(0,0.054,0.184,0.349,0.521,0.68,0.815,0.92,0.996,1.046,1.073,1.083,1.081,1.072,1.059,1.044,1.031,1.019,1.009,1.002,0.997,0.994,0.993,0.993,0.994,0.995,0.996,0.997,1);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15140f; --panel:#1e1c17; --panel-2:#272420; --fill-3:rgba(236,239,231,.06); --line:#37342c;
  --ink:#f2efe8; --dim:#a29c8f; --faint:rgba(236,239,231,.38);
  --accent:#6b9fd0; --accent-soft:#1f2a35; --on-tint:#0f141a; --glow:rgba(107,159,208,.35);
  --ok:#7fae87; --ok-soft:#22302a; --amber:#e0a447; --amber-soft:#3a2e1c;
  --toast:#f2efe8; --toast-ink:#15140f;
  --glass-tint:rgba(36,34,28,.58); --glass-edge:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.07);
  --elev-1:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03);
  --elev-3:0 0 0 1px rgba(255,255,255,.05),0 8px 16px rgba(0,0,0,.35),0 24px 64px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140f; --panel:#1e1c17; --panel-2:#272420; --fill-3:rgba(236,239,231,.06); --line:#37342c;
  --ink:#f2efe8; --dim:#a29c8f; --faint:rgba(236,239,231,.38);
  --accent:#6b9fd0; --accent-soft:#1f2a35; --on-tint:#0f141a; --glow:rgba(107,159,208,.35);
  --ok:#7fae87; --ok-soft:#22302a; --amber:#e0a447; --amber-soft:#3a2e1c;
  --toast:#f2efe8; --toast-ink:#15140f;
  --glass-tint:rgba(36,34,28,.58); --glass-edge:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.07);
  --elev-1:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03);
  --elev-3:0 0 0 1px rgba(255,255,255,.05),0 8px 16px rgba(0,0,0,.35),0 24px 64px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none}

/* ---------- shell ---------- */
.app{width:390px;max-width:100%;height:min(844px,calc(100vh - 80px));min-height:640px;border-radius:32px;box-shadow:var(--elev-3);
  position:relative;overflow:hidden;overflow:clip;background:#000;isolation:isolate}
.stage{position:absolute;inset:0;background:var(--bg);overflow:hidden;overflow:clip;transform-origin:50% 100%;will-change:transform}
.stage::before{content:"";position:absolute;left:-20%;right:-20%;top:-140px;height:360px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;z-index:0}
.caption{font-size:12.5px;color:var(--dim);text-align:center;margin:0}
.nav{position:relative;z-index:2;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 0}
.nav[hidden]{display:none!important}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:15px;padding:6px 8px;border-radius:var(--r-control);justify-self:start;transition:opacity .15s}
.nav .back:active{opacity:.45}
.nav .ttl{font-weight:600;font-size:15px}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.view > *{flex-shrink:0}
.view.has-nav{top:52px}
.view.root{padding-top:14px}
.view.push{animation:pushIn .55s var(--spring)}
.view.pop{animation:popIn .55s var(--spring)}
.view.fade{animation:fadeIn .25s ease-out}
@keyframes pushIn{from{transform:translateX(56px);opacity:0}}
@keyframes popIn{from{transform:translateX(-56px);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}}

/* ---------- type + lists ---------- */
h1{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:4px 0 2px;line-height:1.15;text-wrap:balance}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:22px 14px 8px}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.lede{color:var(--dim);margin:0}
.ig{background:var(--panel);border-radius:var(--r-card);box-shadow:var(--elev-1);overflow:hidden;position:relative;z-index:1}
.ig-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;position:relative;width:100%;text-align:left}
.ig-row + .ig-row::before{content:"";position:absolute;top:0;right:0;left:56px;height:1px;background:var(--line)}
.ig-row.plain + .ig-row.plain::before,.ig-row.slot + .ig-row::before{left:14px}
.tap{transition:transform .3s var(--spring),filter .12s}
.ig-row.tap:active{filter:brightness(.95)}
.ig-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ig-title{font-size:15px;font-weight:500}
.ig-sub{font-size:12.5px;color:var(--dim)}
.ig-val{color:var(--dim);font-size:15px}
.ig-footer{font-size:12.5px;color:var(--dim);margin:8px 14px 0}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.tile.ok{background:var(--ok-soft);color:var(--ok)} .tile.amber{background:var(--amber-soft);color:var(--amber)} .tile.mute{background:var(--panel-2);color:var(--dim)}
.chev{color:var(--faint);display:flex}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--dim);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:var(--on-tint);transition:background .2s,border-color .2s}
.tick svg{width:13px;height:13px;stroke-width:3.2;opacity:0;transform:scale(.3)}
[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent)}
[aria-checked="true"] .tick svg{opacity:1;transform:none;transition:transform .7s var(--spring-bouncy),opacity .1s}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;margin-bottom:12px}
.wm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.wm svg{color:var(--accent);width:20px;height:20px}
.loc{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--fill-3);padding:5px 10px;border-radius:999px}
.loc svg{width:14px;height:14px}
.hero{padding:16px 16px 14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.pods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.pod b{font-size:12.5px;font-weight:600;margin-top:6px}
.pod span{color:var(--dim)}
.pod.free span{color:var(--ok);font-weight:600}
.pod.busy span{color:var(--amber);font-weight:600}
.cap{width:100%;max-width:62px;height:88px;border-radius:31px;position:relative;overflow:hidden;background:var(--fill-3);border:1px solid var(--line);display:grid;place-items:center}
.pod.free .cap{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.cap .glow{position:absolute;inset:18% 14%;border-radius:999px;background:radial-gradient(closest-side,var(--glow),transparent);animation:breathe 4.2s ease-in-out infinite}
.pod:nth-child(2) .glow{animation-delay:-1.3s}.pod:nth-child(3) .glow{animation-delay:-2.4s}.pod:nth-child(4) .glow{animation-delay:-3.1s}
@keyframes breathe{50%{opacity:.35;transform:scale(.86)}}
.cap .fill{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:bottom;background:var(--amber-soft);transition:transform .6s var(--spring)}
.cap svg{position:relative;color:var(--amber);width:18px;height:18px}
.pod.clean > span{color:var(--accent);font-weight:600}
.pod.clean .cap{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.pod.clean .fill{background:var(--accent-soft)}
.pod.clean .cap svg{color:var(--accent)}
.cap .wipe{position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(transparent,color-mix(in srgb,var(--accent) 28%,transparent),transparent);animation:wipe 2.2s ease-in-out infinite}
@keyframes wipe{to{transform:translateY(350%)}}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.pk{background:var(--panel);border-radius:18px;box-shadow:var(--elev-1);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;position:relative;
  transition:transform .35s var(--spring),box-shadow .25s}
.pk:active{transform:scale(.96)}
.pk[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--elev-1)}
.pk .tile{margin-bottom:10px}
.pk-name{font-size:15px;font-weight:600;line-height:1.25}
.pk-sub{font-size:12.5px;color:var(--dim);line-height:1.35;min-height:2.7em}
.pk-price{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.pk-price small{font-size:14px;font-weight:700;color:var(--dim)}
.pk-badge{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-tint);display:grid;place-items:center;transform:scale(0);opacity:0;transition:transform .25s ease,opacity .15s}
.pk-badge svg{width:13px;height:13px;stroke-width:3.2}
.pk[aria-checked="true"] .pk-badge{transform:none;opacity:1;transition:transform .7s var(--spring-bouncy),opacity .1s}
.feats{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px}
.feats div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.2}
.feats svg{color:var(--ink);opacity:.75}

/* ---------- time ---------- */
.when{display:flex;align-items:center;gap:16px;padding:16px;margin-top:6px}
.when-t{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.05;flex:none}
.when-t.dimmed{color:var(--faint)}
.when-m{display:flex;flex-direction:column;min-width:0}
.when-m b{font-size:15px;font-weight:600}
.swap{animation:swapIn .5s var(--spring)}
@keyframes swapIn{from{transform:translateY(10px);opacity:0}}
.strip-wrap{margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;position:relative;z-index:1}
.strip-wrap::-webkit-scrollbar{display:none}
.strip{display:flex;gap:8px;padding:2px max(16px,env(safe-area-inset-left,0px));position:relative;width:max-content}
.day{width:62px;height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;z-index:1;
  background:var(--panel);box-shadow:var(--elev-1);scroll-snap-align:center;transition:color .25s,transform .35s var(--spring)}
.day:active{transform:scale(.94)}
.day span{font-size:11.5px;font-weight:600;color:var(--dim);transition:color .25s}
.day b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.day small{font-size:10.5px;color:var(--dim);transition:color .25s}
.day[aria-pressed="true"]{color:var(--on-tint);background:transparent;box-shadow:none}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--on-tint);opacity:.85}
.thumb{position:absolute;left:0;top:0;border-radius:inherit;pointer-events:none;z-index:0}
.strip .thumb{top:2px;height:76px;border-radius:18px;background:var(--accent);box-shadow:0 6px 18px var(--glow)}
.seg{display:flex;background:var(--panel-2);border-radius:12px;padding:3px;position:relative;margin-top:14px;z-index:1}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--dim);position:relative;z-index:1;transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button em{font-style:normal;font-size:11px;font-weight:700;color:var(--faint)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg .thumb{top:3px;bottom:3px;border-radius:9px;background:var(--panel);box-shadow:var(--elev-1)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}
.list-head h2{margin:0 0 0 14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full-tog{display:flex;align-items:center;gap:6px;flex:none;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--fill-3);border:1px solid var(--line);padding:6px 11px;border-radius:999px;transition:transform .3s var(--spring),background .25s,color .25s}
.full-tog svg{width:15px;height:15px}
.full-tog:active{transform:scale(.94)}
.full-tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.ig-row.slot{min-height:56px}
.st{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.st b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.st small{font-size:12.5px;color:var(--dim)}
.mini{display:flex;gap:3px}
.mini i{width:6px;height:14px;border-radius:3px;background:var(--line)}
.mini i.on{background:var(--ok)}
.free-t{font-size:12.5px;font-weight:600;color:var(--ok);min-width:44px;text-align:right}
.free-t.low{color:var(--amber)} .free-t.full{color:var(--faint)}
.slot[aria-disabled="true"]{opacity:.45}
.rise{animation:rise .5s var(--spring) backwards}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.switch{width:51px;height:31px;border-radius:999px;background:var(--panel-2);position:relative;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- acrylic dock ---------- */
.acrylic{position:relative;isolation:isolate;background:var(--glass-tint);
  backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 32px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08)}
.acrylic::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--noise);background-size:160px;opacity:.09;mix-blend-mode:overlay;pointer-events:none;z-index:-1}
.dock{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
.dock > *{pointer-events:auto;will-change:transform}
.cta{height:56px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:color-mix(in srgb,var(--accent) 84%,transparent);color:var(--on-tint);border-color:color-mix(in srgb,#fff 25%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px var(--glow),0 1px 3px rgba(0,0,0,.1);transition:filter .2s,background .3s}
.cta:active{filter:brightness(.92)}
.cta[aria-disabled="true"]{background:var(--glass-tint);color:var(--dim);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 24px rgba(0,0,0,.1);cursor:not-allowed}
.cta .l{font-weight:700;font-size:16px;line-height:1.2}
.cta .s{font-size:12px;font-weight:500;opacity:.8;line-height:1.2}
.cta-in{animation:swapIn .45s var(--spring)}
.tabs{height:64px;border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;position:relative}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);z-index:0}
.tabs button{border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;z-index:1;
  font-size:10.5px;font-weight:650;letter-spacing:-.01em;color:var(--dim);transition:color .25s}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button.pop svg{animation:iconPop .6s var(--spring-bouncy)}
@keyframes iconPop{from{transform:scale(.6) translateY(3px)}}
.tabs .dot{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel);transform:scale(0);transition:transform .6s var(--spring-bouncy)}
.tabs .has .dot{transform:scale(1)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:#000;opacity:0;z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:90%;overflow-y:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  border-top:1px solid var(--glass-edge);box-shadow:0 -12px 40px rgba(0,0,0,.2);

const S={tab:'book',stacks:{book:['home'],bookings:['list'],account:['me'],feedback:['root']},

function centerDay(smooth){ // scroll only the strip, never the app
  const w=$('#stripWrap'), d=$('#strip [aria-pressed="true"]'); if(!w||!d) return;

function autoPeriod(){ const has=k=>TIMES.some(t=>perOf(t)===k&&isOpen(S.day,t)); if(!has(S.per)){ const f=PER.find(p=>has(p[0])); if(f) S.per=f[0]; } }
function paintPeriod(){ PER.forEach(([k])=>{ const n=TIMES.filter(t=>perOf(t)===k&&isOpen(S.day,t)).length; $('#pc'+k).textContent=n||'';
  const b=$(`#per [data-v="${k}"]`); b.setAttribute('aria-pressed',S.per===k); }); }
function paintSlots(){
  const list=TIMES.filter(t=>perOf(t)===S.per&&!past(S.day,t)), shown=list.filter(t=>S.showFull||free(S.day,t)>0);
  const soon=TIMES.find(t=>isOpen(S.day,t)), name=PER.find(p=>p[0]===S.per)[1];
  $('#listHead').textContent=`${dayShort(S.day)} · ${name}`;
  const box=$('#slots');
  if(!shown.length){
    const nextDay=DAYS.findIndex((_,i)=>i>S.day&&TIMES.some(t=>isOpen(i,t)));
    box.innerHTML=`<div class="ig"><div class="empty"><span class="empty-icon">${ic('moon')}</span><b>${list.length?'All full':'No more slots'}</b>
      <p>${list.length?'Every pod is booked in this part of the day.':`Nothing left ${S.day===0?'this '+name.toLowerCase():'here'}.`}</p>

    icons(); return;
  }
  box.innerHTML=`<div class="ig" role="radiogroup" aria-label="Times">${shown.map((t,i)=>{const f=free(S.day,t),on=S.sel&&S.sel.d===S.day&&S.sel.t===t;

     <span class="st"><b>${t}</b><small>${money(priceAt(S.pkg,S.day,t))}</small>${t===soon&&f?'<span class="pill accent">Soonest</span>':''}</span>
     <span class="mini" aria-hidden="true">${[0,1,2,3].map(j=>`<i class="${j<f?'on':''}"></i>`).join('')}</span>

  <p class="ig-footer">${EXAM.has(S.day)?`Exam week: every slot is ${money(PKG[S.pkg].peak)}. Book a day earlier to save.`

  icons();
}
function paintWhen(anim){
  const w=$('#when'); if(!w) return;
  if(S.sel){ const f=free(S.sel.d,S.sel.t);
    w.innerHTML=`<span class="when-t${anim?' swap':''}">${S.sel.t}</span><span class="when-m${anim?' swap':''}"><b>${dayLong(S.sel.d)}</b><span class="ig-sub">Until ${plus20(S.sel.t)} · ${money(priceAt(S.pkg,S.sel.d,S.sel.t))} ${isPeak(S.sel.d,S.sel.t)?'peak':'off-peak'} · ${f} of 4 free</span></span>`;

    case 'copy': { const t=resp.map((r,i)=>`#${i+1} ${r.t||''}${r.who?' ('+r.who+')':''}, ${r.pkg}: easy ${r.easy}/5, fair price ${r.price}/5, would use ${r.use}/5, beats coffee ${r.better}/5${r.back!=null?', comes back '+r.back+'/5':''}${r.change?'. Change: "'+r.change+'"':''}`).join('\n');

    S.fb={};S.fbText='';S.fbWho='';S.fbDone=true; S.tab='feedback'; S.stacks.feedback=['root']; render('pop'); toast(msg); };
  ctaAction=null;
  if(DB) DB.collection('feedback').add(rec).then(()=>done('Thanks. Feedback sent.'))
    .catch(()=>{ local.push(rec); store.set(local); resp.push(rec); done('Saved on this phone only. Copy it into the doc.'); });
  else { local.push(rec); store.set(local); resp.push(rec); done('Thanks. Saved on this phone.'); }
}

/* ---------- nap ---------- */
function startNap(keep){
  if(napTimer) clearInterval(napTimer); if(!keep) napLeft=1200;
  const C=804.25, arc=$('#arc'), tl=$('#tleft'); if(!arc) return;
  const paint=()=>{ tl.textContent=String(Math.floor(napLeft/60)).padStart(2,'0')+':'+String(napLeft%60).padStart(2,'0'); arc.setAttribute('stroke-dashoffset',(C*(1-napLeft/1200)).toFixed(1)); };
  paint();
  napTimer=setInterval(()=>{ napLeft=Math.max(0,napLeft-(S.fast?60:1)); paint(); if(!napLeft){ clearInterval(napTimer); napTimer=null; chime(); push('alarm'); } },1000);
}
function finishNap(){ PODS[2]={st:'clean',m:CLEAN}; S.history.unshift(S.booking); S.booking=null; S.stacks.bookings=['list'];
  const msg=S.user?addStamp():'All done. Good luck in class.'; render('fade'); toast(msg,S.user?'stamp':'check'); }
function chime(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
  [0,.3,.6].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,880,990][i];o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.5);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+.55);});}catch(e){} }
function drawQR(){ // decorative, seeded from the code; not a scannable QR
  const cv=$('#qr'); if(!cv) return; const W=cv.width, x=cv.getContext('2d'), n=21, sz=W/n;
  let seed=[...S.booking.code].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0; const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;
  x.fillStyle='#fff';x.fillRect(0,0,W,W);x.fillStyle='#1b1a18';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++) if(rnd()>.5) x.fillRect(i*sz,j*sz,sz,sz);
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle='#1b1a18';x.fillRect(a*sz,b*sz,7*sz,7*sz);x.fillStyle='#fff';x.fillRect((a+1)*sz,(b+1)*sz,5*sz,5*sz);x.fillStyle='#1b1a18';x.fillRect((a+2)*sz,(b+2)*sz,3*sz,3*sz);});
}

/* ---------- boot ---------- */
render();
setInterval(()=>{ PODS.forEach(p=>{ if(p.st==='free') return; p.m--; if(p.m<=0){ if(p.st==='busy'){ p.st='clean'; p.m=CLEAN; } else { p.st='free'; p.m=0; } } });
  if(cur()==='home') paintPods(); },60000);
(async()=>{ try{
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!db) return; DB=db;
  db.collection('feedback').orderBy('ts').onSnapshot(s=>{
    const shared=s.docs.map(d=>d.data()); resp=shared.concat(local.filter(r=>!shared.some(x=>x.ts===r.ts)));
    if(['root','responses'].includes(cur())) render('stay');
  },()=>{ DB=null; });
}catch(e){} })();
</script>
